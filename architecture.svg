<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="Poppins, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">CORES architecture</title>
<desc id="d">Documents are OCR-processed, chunked, embedded and stored in FAISS. Each user question retrieves the top 3 chunks, which are combined with the prompt rules and conversation memory and sent to GPT-4. The answer is returned with its response time and logged.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4a5a74"/></marker></defs>
<rect width="880" height="520" fill="#ffffff"/>
<g font-size="13" fill="#0b1f3a">
<text x="40" y="38" font-size="15" font-weight="600" fill="#8a6a25">1  KNOWLEDGE BASE (built once)</text>
<rect x="40" y="56" width="170" height="78" rx="10" fill="#f6efdc" stroke="#c9a24a"/>
<text x="125" y="88" text-anchor="middle" font-weight="600">Scanned forms</text><text x="125" y="108" text-anchor="middle" font-size="11.5" fill="#4a5a74">PDF / Word documents</text>
<rect x="250" y="56" width="170" height="78" rx="10" fill="#eef1f6" stroke="#9fb0c8"/>
<text x="335" y="84" text-anchor="middle" font-weight="600">Text + OCR</text><text x="335" y="104" text-anchor="middle" font-size="11.5" fill="#4a5a74">PyMuPDF, docx2txt,</text><text x="335" y="120" text-anchor="middle" font-size="11.5" fill="#4a5a74">Tesseract on images</text>
<rect x="460" y="56" width="170" height="78" rx="10" fill="#eef1f6" stroke="#9fb0c8"/>
<text x="545" y="84" text-anchor="middle" font-weight="600">Chunk + embed</text><text x="545" y="104" text-anchor="middle" font-size="11.5" fill="#4a5a74">1,000 chars, 200 overlap</text><text x="545" y="120" text-anchor="middle" font-size="11.5" fill="#4a5a74">OpenAI embeddings</text>
<rect x="670" y="56" width="170" height="78" rx="10" fill="#0b1f3a"/>
<text x="755" y="90" text-anchor="middle" font-weight="600" fill="#e8c97a">FAISS index</text><text x="755" y="110" text-anchor="middle" font-size="11.5" fill="#c9d4e6">vector search</text>
<path d="M210 95H246" stroke="#4a5a74" stroke-width="1.6" marker-end="url(#a)"/><path d="M420 95H456" stroke="#4a5a74" stroke-width="1.6" marker-end="url(#a)"/><path d="M630 95H666" stroke="#4a5a74" stroke-width="1.6" marker-end="url(#a)"/>
<text x="40" y="190" font-size="15" font-weight="600" fill="#8a6a25">2  EVERY QUESTION</text>
<rect x="40" y="208" width="170" height="78" rx="10" fill="#f6efdc" stroke="#c9a24a"/>
<text x="125" y="240" text-anchor="middle" font-weight="600">User question</text><text x="125" y="260" text-anchor="middle" font-size="11.5" fill="#4a5a74">chat interface</text>
<rect x="250" y="208" width="380" height="78" rx="10" fill="#eef1f6" stroke="#9fb0c8"/>
<text x="440" y="236" text-anchor="middle" font-weight="600">Retrieve top 3 relevant chunks</text><text x="440" y="256" text-anchor="middle" font-size="11.5" fill="#4a5a74">similarity search against the FAISS index</text>
<path d="M210 247H246" stroke="#4a5a74" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M755 134V247H634" stroke="#4a5a74" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="40" y="330" width="250" height="96" rx="10" fill="#eef1f6" stroke="#9fb0c8"/>
<text x="165" y="358" text-anchor="middle" font-weight="600">Prompt rules</text><text x="165" y="378" text-anchor="middle" font-size="11.5" fill="#4a5a74">persona, plain language, one field</text><text x="165" y="394" text-anchor="middle" font-size="11.5" fill="#4a5a74">at a time, cite sections, stay on task,</text><text x="165" y="410" text-anchor="middle" font-size="11.5" fill="#4a5a74">ask to rephrase rather than guess</text>
<rect x="315" y="330" width="250" height="96" rx="10" fill="#eef1f6" stroke="#9fb0c8"/>
<text x="440" y="368" text-anchor="middle" font-weight="600">Conversation memory</text><text x="440" y="388" text-anchor="middle" font-size="11.5" fill="#4a5a74">recent turns (windowed)</text>
<rect x="590" y="330" width="250" height="96" rx="10" fill="#0b1f3a"/>
<text x="715" y="366" text-anchor="middle" font-weight="600" fill="#e8c97a">GPT-4 via LangChain</text><text x="715" y="386" text-anchor="middle" font-size="11.5" fill="#c9d4e6">rules + memory + retrieved context</text>
<path d="M440 286V326" stroke="#4a5a74" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M290 378H311" stroke="#4a5a74" stroke-width="1.6" marker-end="url(#a)"/><path d="M565 378H586" stroke="#4a5a74" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="315" y="456" width="525" height="48" rx="10" fill="#f6efdc" stroke="#c9a24a"/>
<text x="577" y="485" text-anchor="middle" font-weight="600">Step-by-step guidance + response time, logged; user rates 1–5 at the end</text>
<path d="M715 426V452" stroke="#4a5a74" stroke-width="1.6" marker-end="url(#a)"/>
</g></svg>
